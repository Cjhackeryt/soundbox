name: Build & Conformance Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Validate
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install Macro Deck Plugin CLI
        run: dotnet tool install -g MacroDeck.Plugin.Cli --prerelease

      - name: Restore Dependencies
        run: dotnet restore SoundBox.csproj

      - name: Build Project
        run: dotnet build SoundBox.csproj -c Release --no-restore

      - name: Build & Package Plugin
        run: macrodeck-plugin build --source . --force

      - name: Validate Plugin Artifact
        run: macrodeck-plugin validate --artifact com.cjhackeryt.soundbox-*.macroDeckPlugin

      - name: Run Conformance Tests
        run: macrodeck-plugin test --artifact com.cjhackeryt.soundbox-*.macroDeckPlugin

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.cjhackeryt.soundbox-plugin
          path: "*.macroDeckPlugin"
          if-no-files-found: error
