name: Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install Macro Deck Plugin CLI
        run: dotnet tool install -g MacroDeck.Plugin.Cli --prerelease

      - name: Build & Package Plugin
        run: macrodeck-plugin build --source . --force

      - name: Validate Plugin Artifact
        run: macrodeck-plugin validate --artifact com.cjhackeryt.soundbox-*.macroDeckPlugin

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: "*.macroDeckPlugin"
          generate_release_notes: true
